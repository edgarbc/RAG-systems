name: CI

on:
  push:
    branches: [main, 'portfolio/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RAG demo
        run: |
          python demo/run_rag_demo.py

      - name: Verify demo exit code
        run: |
          echo "Demo completed successfully with exit code 0"
